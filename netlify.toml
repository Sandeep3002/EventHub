[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://eventhub-api-sandeep.loca.lt/api/:splat"
  status = 200
  force = true
  headers = { Bypass-Tunnel-Reminder = "true" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
