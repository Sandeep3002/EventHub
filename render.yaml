services:
  - type: web
    name: eventhub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_NAME
        value: eventhub_db
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_PASSWORD
        sync: false
      - key: MONGODB_URL
        sync: false
