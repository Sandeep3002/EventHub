<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0E7FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Stage interior -->
  <path d="M14 30 Q32 18 50 30 L50 54 L14 54 Z" fill="url(#stage)"/>
  <!-- Spotlight beams -->
  <path d="M24 27 L19 44 L29 44 Z" fill="url(#beam)"/>
  <path d="M32 25 L27 44 L37 44 Z" fill="url(#beam)"/>
  <path d="M40 27 L35 44 L45 44 Z" fill="url(#beam)"/>
  <circle cx="24" cy="27" r="1.4" fill="#FFFFFF"/>
  <circle cx="32" cy="25" r="1.6" fill="#FFFFFF"/>
  <circle cx="40" cy="27" r="1.4" fill="#FFFFFF"/>
  <!-- Stage floor -->
  <ellipse cx="32" cy="44" rx="15" ry="2.2" fill="#A5B4FC" opacity="0.6"/>

  <!-- Audience -->
  <g fill="#312E81">
    <circle cx="20" cy="47" r="2.6"/><path d="M15 55 a5 4.5 0 0 1 10 0 Z"/>
    <circle cx="44" cy="47" r="2.6"/><path d="M39 55 a5 4.5 0 0 1 10 0 Z"/>
    <circle cx="26" cy="46" r="3"/><path d="M20.5 55 a5.5 5 0 0 1 11 0 Z"/>
    <circle cx="38" cy="46" r="3"/><path d="M32.5 55 a5.5 5 0 0 1 11 0 Z"/>
  </g>
  <circle cx="32" cy="44" r="3.8" fill="#1E1B4B"/>
  <path d="M25 56 a7 6.5 0 0 1 14 0 Z" fill="#1E1B4B"/>

  <!-- Ribbons -->
  <path d="M30 14 C18 16 8 24 7 36 C6 48 14 57 26 58 L22 54 C14 51 11 44 12 37 C13 27 21 21 30 19 Z" fill="url(#rl)"/>
  <path d="M34 14 C46 16 56 24 57 36 C58 48 50 57 38 58 L42 54 C50 51 53 44 52 37 C51 27 43 21 34 19 Z" fill="url(#rr)"/>

  <!-- Star -->
  <path d="M32 2 C33 7 35 9 40 10 C35 11 33 13 32 18 C31 13 29 11 24 10 C29 9 31 7 32 2 Z" fill="url(#star)"/>
</svg>
