<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.6" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="rr" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="crowd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft glows -->
  <circle cx="50" cy="13" r="12" fill="url(#glow)"/>
  <ellipse cx="50" cy="90" rx="38" ry="6" fill="url(#glow)"/>

  <!-- Stage interior (dome) -->
  <path d="M20 46 Q50 28 80 46 L80 84 L20 84 Z" fill="url(#stage)"/>

  <!-- Lighting truss -->
  <ellipse cx="50" cy="40" rx="18" ry="3.5" fill="none" stroke="#818CF8" stroke-width="1"/>

  <!-- Side panels -->
  <path d="M26 50 L33 47 L33 68 L26 70 Z" fill="url(#panel)" opacity="0.9"/>
  <path d="M74 50 L67 47 L67 68 L74 70 Z" fill="url(#panel)" opacity="0.9"/>

  <!-- Screen -->
  <path d="M36 52 Q50 49 64 52 L64 66 L36 66 Z" fill="#A5B4FC" opacity="0.35"/>

  <!-- Spotlight beams -->
  <path d="M38 41 L30 66 L44 66 Z" fill="url(#beam)"/>
  <path d="M50 39 L43 66 L57 66 Z" fill="url(#beam)"/>
  <path d="M62 41 L56 66 L70 66 Z" fill="url(#beam)"/>
  <circle cx="38" cy="41" r="1.8" fill="#FFFFFF"/>
  <circle cx="50" cy="39" r="2.1" fill="#FFFFFF"/>
  <circle cx="62" cy="41" r="1.8" fill="#FFFFFF"/>

  <!-- Stage floor -->
  <ellipse cx="50" cy="68" rx="24" ry="3" fill="#C7D2FE" opacity="0.55"/>

  <!-- Audience -->
  <g fill="url(#crowd)">
    <circle cx="29" cy="73" r="3.6"/><path d="M22 85 a7 6.5 0 0 1 14 0 Z"/>
    <circle cx="71" cy="73" r="3.6"/><path d="M64 85 a7 6.5 0 0 1 14 0 Z"/>
    <circle cx="38" cy="71" r="4.2"/><path d="M30.5 85 a7.5 7 0 0 1 15 0 Z"/>
    <circle cx="62" cy="71" r="4.2"/><path d="M54.5 85 a7.5 7 0 0 1 15 0 Z"/>
  </g>
  <circle cx="50" cy="67" r="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.6"/>
  <path d="M38.5 86 a11.5 10.5 0 0 1 23 0 Z" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.6"/>

  <!-- Left ribbon: rises to top center, curls outward at bottom-left -->
  <path d="M47 21 C42 16 34 19 24 26 C12 34 8 44 10 56
           C4 58 2 64 5 70 C9 80 22 88 40 88
           L36 84 C26 82 20 76 20 70 C20 64 24 61 28 62
           C22 56 21 46 28 38 C34 31 41 27 47 26 Z" fill="url(#rl)"/>

  <!-- Right ribbon -->
  <path d="M53 21 C58 16 66 19 76 26 C88 34 94 46 92 60
           C91 74 82 86 62 88
           L66 84 C76 80 82 72 82 62 C82 50 78 42 72 37
           C66 31 59 27 53 26 Z" fill="url(#rr)"/>

  <!-- Star -->
  <path d="M50 2 C51.5 9 54 11.5 61 13 C54 14.5 51.5 17 50 24 C48.5 17 46 14.5 39 13 C46 11.5 48.5 9 50 2 Z" fill="url(#star)"/>
</svg>
